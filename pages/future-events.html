<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HAT Challengers — tournaments, events, and community dedicated to the Yu-Gi-Oh! HAT format.">
  <meta name="theme-color" content="#18231B">
  <title>Future Events | HAT Challengers</title>
  <link rel="icon" href="../assets/hat-challengers-favicon.png" type="image/png">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/ranking.css">
  <link rel="stylesheet" href="../css/events.css">
  <script src="../js/constants.js?v=2" defer></script>
  <script src="../js/main.js" defer></script>
  <script src="../js/events.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html" aria-label="HAT Challengers home"><img src="../assets/logo_challengers.png" alt="" width="48" height="48"><span>HAT <strong>CHALLENGERS</strong></span></a>
      <button class="menu-toggle" aria-expanded="false" aria-controls="navigation" hidden>Menu <span aria-hidden="true">☰</span></button>
      <nav id="navigation" aria-label="Main navigation"><a href="../index.html">Home</a><a href="../pages/future-events.html" aria-current="page">Future Events</a><a href="../pages/ranking.html">Ranking</a><a href="../pages/team.html">Team</a><a href="../pages/collab.html">Collab with Us</a></nav>
    </div>
  </header>
  <main id="main" class="events-page">
    <img class="events-art" src="../assets/honor_arc.png" alt="" width="922" height="784">
    <section class="container page-heading">
      <p class="eyebrow" data-slogan></p>
      <h1>Future Events</h1>
    </section>
    <section class="container content-section" aria-label="Upcoming events">
      <div class="ranking-options events-options" role="group" aria-label="Event category">
        <button type="button" data-category="major" aria-controls="events-table" aria-pressed="true">Major Events</button>
        <button type="button" data-category="local" aria-controls="events-table" aria-pressed="false">Locals</button>
      </div>
      <div class="table-scroll ranking-backdrop events-backdrop" tabindex="0" role="region" aria-label="Upcoming events table">
        <table class="events-table" id="events-table">
          <caption class="sr-only">Upcoming HAT Challengers events</caption>
          <thead>
            <tr>
              <th scope="col">Event</th>
              <th scope="col">Date</th>
              <th scope="col">Venue</th>
              <th scope="col">Address</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <noscript><p class="content-note">Enable JavaScript to view upcoming events.</p></noscript>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="footer-brand" href="../index.html">HAT CHALLENGERS<span data-slogan></span></a>
      <div class="footer-social">
        <h2>Follow us on:</h2>
        <a href="https://www.instagram.com/hat_challengers/" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="https://www.youtube.com/@HatChallengers/streams" target="_blank" rel="noopener noreferrer">YouTube</a>
      </div>
      <a href="../pages/collab.html">Collab with us!</a>
    </div>
  </footer>

</html>
