<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="HAT Challengers — tournaments, events, and community dedicated to the Yu-Gi-Oh! HAT format.">
  <meta name="theme-color" content="#18231B">
  <title>Ranking | HAT Challengers</title>
  <link rel="icon" href="../assets/hat-challengers-favicon.png" type="image/png">
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/ranking.css">
  <script src="../js/constants.js?v=2" defer></script>
  <script src="../js/main.js" defer></script>
  <script type="module" src="../js/ranking.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="../index.html" aria-label="HAT Challengers home"><img src="../assets/logo_challengers_dark.png" alt="" width="48" height="48"><span>HAT <strong>CHALLENGERS</strong></span></a>
      <button class="menu-toggle" aria-expanded="false" aria-controls="navigation" hidden>Menu <span aria-hidden="true">☰</span></button>
      <nav id="navigation" aria-label="Main navigation"><a href="../index.html">Home</a><a href="../pages/future-events.html">Future Events</a><a href="../pages/ranking.html" aria-current="page">Ranking</a><a href="../pages/team.html">Team</a><a href="../pages/collab.html">Collab with Us</a></nav>
    </div>
  </header>
  <main id="main" class="ranking-page">
    <section class="container page-heading">
      <p class="eyebrow" data-slogan></p>
      <h1>Ranking</h1>
    </section>
    <section class="container content-section" aria-labelledby="standings-heading">
      <div class="panel-heading">
        <h2 id="standings-heading">Player standings (rankings will be updated every end of the week)</h2>
        <div class="ranking-options" role="group" aria-label="Ranking type">
          <button type="button" data-points="challengerPts" aria-pressed="true">Challengers Ranking</button>
          <button type="button" data-points="localPts" aria-pressed="false">Local ranking</button>
        </div>
      </div>
      <div class="table-scroll ranking-backdrop">
        <table class="ranking-table">
          <caption class="sr-only">HAT Challengers player standings</caption>
          <thead>
            <tr>
              <th scope="col">Rank</th>
              <th scope="col">Name</th>
              <th scope="col" data-points="challengerPts" aria-sort="descending">Challengers Points</th>
              <th scope="col" data-points="localPts">Local pts</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <noscript><p class="content-note">Enable JavaScript to view player standings.</p></noscript>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container footer-inner">
      <a class="footer-brand" href="../index.html">HAT CHALLENGERS<span data-slogan></span></a>
      <div class="footer-social">
        <h2>Follow us on:</h2>
        <a href="https://www.instagram.com/hat_challengers/" target="_blank" rel="noopener noreferrer">Instagram</a>
        <a href="https://www.youtube.com/@HatChallengers/streams" target="_blank" rel="noopener noreferrer">YouTube</a>
      </div>
      <a href="../pages/collab.html">Collab with us!</a>
    </div>
  </footer>
</body>
</html>
